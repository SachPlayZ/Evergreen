# Serves the read-only gateway over HTTPS. Set server_name, then `certbot --nginx` adds the 443 block.
server {
    listen 80;
    server_name 152-67-0-76.sslip.io;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 64k;
    }
}
